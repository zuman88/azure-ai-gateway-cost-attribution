# GitHub Pages configuration.
#
# Source is this docs/ folder, so paths below are relative to it.
#
# The plugin choice matters: none of the documents here carry YAML front
# matter, because front matter renders as an ugly table when the same files are
# browsed on github.com. jekyll-optional-front-matter lets Jekyll process them
# anyway, so the docs stay readable in both places without being duplicated.

title: Azure AI Gateway & Cost Attribution
tagline: Microsoft Foundry on Azure API Management
description: >-
  Reference architecture and production-grade Terraform for running Azure API
  Management as a centralised AI Gateway in front of Microsoft Foundry and
  Azure OpenAI model deployments, with per-application cost attribution and
  chargeback reconciled against Azure Cost Management.

url: https://zuman88.github.io
baseurl: /azure-ai-gateway-cost-attribution

author: Muazu Isah
lang: en_GB

theme: jekyll-theme-primer

plugins:
  # Render .md files that have no YAML front matter.
  - jekyll-optional-front-matter
  # Rewrite relative links like ./policies.md so they resolve as site URLs.
  - jekyll-relative-links
  # <title>, meta description, Open Graph and JSON-LD. This is the SEO payload.
  - jekyll-seo-tag
  # sitemap.xml, which is what Google actually crawls.
  - jekyll-sitemap

relative_links:
  enabled: true
  collections: false

optional_front_matter:
  remove_originals: true

# Per-page titles and descriptions are assigned here rather than in YAML front
# matter, so the documents themselves stay clean when read on github.com.
# Without these every page would inherit the site title, and four pages sharing
# one <title> is wasted search surface.
defaults:
  - scope:
      path: architecture.md
    values:
      title: Architecture
      description: >-
        Topology, request flow and network design for Azure API Management as a
        centralised AI Gateway in front of Microsoft Foundry models, with an
        honest account of the limitations.
  - scope:
      path: cost-attribution.md
    values:
      title: Cost attribution and chargeback
      description: >-
        How to attribute Azure OpenAI token spend to the application that
        caused it: the ledger schema, the allocation maths, and reconciliation
        against Azure Cost Management.
  - scope:
      path: policies.md
    values:
      title: APIM policy reference
      description: >-
        The Azure API Management policy pipeline for an AI Gateway, section by
        section, with the authoring rules that prevent the usual failures.
  - scope:
      path: operations.md
    values:
      title: Operations guide
      description: >-
        Day-2 operations: regenerating the pricing map, adding models and
        consumers, reading the chargeback workbook, and troubleshooting.

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
