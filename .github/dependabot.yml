version: 2
updates:
  # Pinned action versions go stale quietly; the first symptom is usually a
  # deprecation warning in a CI run nobody reads.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"

  # Terraform provider constraints in the modules are deliberately ranges, so
  # these PRs mostly affect the examples' lock files. That is the intent: the
  # examples should demonstrate a known-good pinned set.
  - package-ecosystem: "terraform"
    directories:
      - "/examples/01-quickstart"
      - "/examples/02-production-private"
      - "/examples/03-cost-attribution"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "terraform"
